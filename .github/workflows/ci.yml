name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install --disable-pip-version-check -e ".[test]"

      - name: Compile
        run: python -m compileall -q app

      - name: Test
        run: pytest

      - name: Build container
        run: docker build -t immich-duplicate-policy:ci .
